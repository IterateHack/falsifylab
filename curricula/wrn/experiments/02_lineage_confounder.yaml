id: h2exp2_lineage_confounder
hypothesis_id: wrn_synthetic_lethal
order: 2
title: Where WRN dependency concentrates
type: reasoning
requires_lessons: [h2exp1_dependency_classes]
inputs:
  datasets: [data/h2exp1_depmap_gene_effects.csv]
  tools: [run_python]
limits: {max_tool_calls: 28, timeout_s: 420, max_python_seconds: 90}
task: |
  You established in experiment 1 which genes are selective dependencies. WRN is
  one of them: most cell lines do not care if you knock it out, and a minority
  die.

  Using the same file, work out **which tissues those dependent lines belong to**,
  and then explain what is actually going on.

  1. Rank the tissues by how concentrated WRN dependency is within them - the
     fraction of that tissue's lines that are dependent. Count a tissue only if it
     has at least 15 cell lines **and** at least one line below -1.0, applying the
     same tail standard to tissues that lesson 1 applied to genes. Without that,
     a tissue with five lines and one weak hit tops the ranking by chance.
  2. Explain what the lineage pattern reflects. Is the tissue of origin itself the
     cause of the dependency, or is it standing in for something else? If it is
     standing in for something, name it, propose the mechanism, and say what you
     would measure next to test it directly.

  The file contains no annotation beyond tissue and disease name. Part of the task
  is recognising what is missing from it.
answer_format: |
  {"top_tissues": ["most dependent", ...],
   "explanation": "what the lineage pattern reflects, and the mechanism",
   "next_test": "what you would measure to test it directly"}
scorer:
  type: rubric
  entrypoint: scorers/h2exp2.py::score
  ground_truth: private/h2exp2.json
teaching:
  papers:
    - "Chan EM, Shibue T, McFarland JM, et al. WRN helicase is a synthetic lethal target in microsatellite unstable cancers. Nature. 2019;568(7753):551-556. doi:10.1038/s41586-019-1102-x"
    - "van Wietmarschen N, Sridharan S, Nathan WJ, et al. Repeat expansions confer WRN dependence in microsatellite-unstable cancers. Nature. 2020;586(7828):292-298. doi:10.1038/s41586-020-2769-8"
  lesson_card: lessons/h2exp2.md
