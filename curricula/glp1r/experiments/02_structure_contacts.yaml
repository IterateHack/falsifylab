id: exp2_structure_contacts
hypothesis_id: glp1r_oral_agonist
order: 2
title: Peptide-receptor structure
type: computational
requires_lessons: []
inputs:
  datasets: [data/exp2_7ki0.cif]
  tools: [run_python]
audit: audit/exp2.yaml
limits: {max_tool_calls: 42, timeout_s: 480, max_python_seconds: 90}
task: |
  `data/exp2_7ki0.cif` is the deposited mmCIF for PDB 7KI0, a 2.5 A cryo-EM
  structure of a semaglutide-bound GLP-1R-Gs complex.

  Identify every GLP-1 receptor residue that contacts semaglutide, where
  "contact" means: any heavy atom (non-hydrogen) of the receptor within 4.0 A of
  any heavy atom of semaglutide.

  The deposited complex contains more than two polymer chains. Work out which
  chain is the receptor and which is the peptide from the file itself rather than
  assuming. Report residue numbers in the deposited author numbering.
answer_format: |
  {"contact_residues": [30, 31, ...],
   "receptor_chain": "X", "peptide_chain": "Y",
   "method": "how you identified the chains and computed contacts"}
scorer:
  type: deterministic
  entrypoint: scorers/exp2.py::score
  ground_truth: private/exp2.json
teaching:
  papers:
    - "Zhang X, Belousoff MJ, Liang YL, Danev R, Sexton PM, Wootten D. Structure and dynamics of semaglutide- and taspoglutide-bound GLP-1R-Gs complexes. Cell Rep. 2021;36(2):109374. doi:10.1016/j.celrep.2021.109374"
  lesson_card: lessons/exp2.md
