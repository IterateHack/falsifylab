<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FalsifyLab episode viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1d2330; --muted: #677085; --line: #dfe3ea;
    --accent: #2f5fd0; --ok: #1d7a46; --ok-bg: #e3f4ea; --bad: #b42318; --bad-bg: #fde8e6;
    --warn: #9a5b00; --warn-bg: #fff1d6; --info-bg: #eaf0fd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .source { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button, .filebtn { font: inherit; padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filebtn input { display: none; }
  main { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 51px); }
  nav { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  nav .ep { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  nav .ep:hover { background: #f1f4fa; }
  nav .ep.active { background: var(--info-bg); box-shadow: inset 3px 0 0 var(--accent); }
  nav .ep .id { font-weight: 600; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  nav .ep .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
  nav .ep .row { display: flex; gap: 6px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: .02em; background: #eef0f4; color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  section#episode { padding: 18px 22px 60px; overflow-y: auto; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .ephead h2 { margin: 0 0 4px; font-size: 18px; font-family: ui-monospace, Menlo, monospace; }
  .ephead .meta { color: var(--muted); font-size: 12px; }
  .controls { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 10px 0; margin: 10px 0 6px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .controls .pos { margin-left: 8px; color: var(--muted); }
  .controls .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
  .card.current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,95,208,.15); }
  .card.future { display: none; }
  .card h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card h3 .step { color: var(--muted); font-weight: 500; font-size: 12px; }
  .card h3 .cost { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(260px, 1.2fr); gap: 16px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 4px; }
  table.kv { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.kv td { padding: 3px 6px; border-bottom: 1px solid #eef0f4; vertical-align: top; }
  table.kv td:first-child { color: var(--muted); white-space: nowrap; width: 1%; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  table.kv td.v { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-word; }
  ul.results { margin: 0; padding-left: 18px; font-size: 13px; }
  ul.results li { margin: 2px 0; }
  .belief { display: grid; grid-template-columns: 34px 1fr 74px; gap: 8px; align-items: center; font-size: 12px; margin: 3px 0; }
  .belief .h { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .belief .h.dom::after { content: " *"; color: var(--accent); }
  .belief .bar { height: 10px; background: #eef0f4; border-radius: 5px; overflow: hidden; }
  .belief .bar span { display: block; height: 100%; background: var(--accent); }
  .belief .n { font-family: ui-monospace, Menlo, monospace; text-align: right; }
  .delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
  .cite { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .cite.notrun { color: var(--bad); font-weight: 600; }
  .verdict-big { font-size: 20px; font-weight: 700; margin: 2px 0 8px; }
  .verdict-big.ok { color: var(--ok); } .verdict-big.bad { color: var(--bad); }
  .scorebox { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .scorebox div { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 110px; }
  .scorebox b { display: block; font-size: 18px; }
  .scorebox span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #flagpanel { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--panel); border-left: 3px solid var(--bad); box-shadow: -8px 0 24px rgba(0,0,0,.12); padding: 18px 20px; overflow-y: auto; transform: translateX(105%); transition: transform .2s ease; z-index: 10; }
  #flagpanel.open { transform: none; }
  #flagpanel .close { position: absolute; top: 12px; right: 14px; }
  #flagpanel h2 { margin: 0 0 6px; font-size: 15px; color: var(--bad); }
  #flagpanel .headline { font-size: 22px; font-weight: 700; margin: 6px 0 14px; padding: 10px 12px; background: var(--bad-bg); border-radius: 8px; }
  .finding { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .finding .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .finding .fid { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  .finding .title { font-weight: 600; margin: 6px 0 4px; }
  .finding .rule { font-size: 13px; color: #3b4356; margin: 0 0 6px; }
  .finding ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .finding a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .error { margin: 12px 18px; padding: 10px 12px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); white-space: pre-wrap; }
  .dropping { outline: 3px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>
<header>
  <h1>FalsifyLab episode viewer</h1>
  <span class="source" id="source"></span>
  <span class="spacer"></span>
  <label class="filebtn">Load results.jsonl<input type="file" id="file" accept=".jsonl,.json,.ndjson,application/json"></label>
  <button id="sample-btn">Sample</button>
</header>
<div class="error" id="error" hidden></div>
<main>
  <nav id="list"></nav>
  <section id="episode"><div class="empty">Load a results.jsonl (button or drag and drop) to replay an episode.</div></section>
</main>

<script>
"use strict";
const REQUIRED = ["job", "verdict", "metrics", "trajectory", "refusals", "refusal_count", "aborted_on_refusals"];
const BAD_VERDICTS = new Set(["UNSAFE_ACTION", "PROTOCOL_VIOLATION", "REWARD_HACK", "PARSE_FAILURE"]);
const state = { records: [], current: -1, step: 0, timer: null, panelShownFor: null };

// ---- loading -----------------------------------------------------------------
function parseJsonl(text) {
  const records = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    let rec;
    try { rec = JSON.parse(line); } catch (e) { throw new Error(`line ${i + 1}: invalid JSON (${e.message})`); }
    if (rec === null || typeof rec !== "object" || Array.isArray(rec)) throw new Error(`line ${i + 1}: not a JSON object`);
    const missing = REQUIRED.filter(k => !(k in rec));
    if (missing.length) throw new Error(`line ${i + 1}: missing ${missing.join(", ")}`);
    records.push(rec);
  });
  if (!records.length) throw new Error("no records found");
  return records;
}

function episodeSteps(rec) {
  let cumulative = 0;
  return (rec.trajectory.turns || []).map(t => {
    const a = t.action || {};
    if (a.kind === "conclude") {
      return { index: t.index, kind: "conclude", contributing_hypotheses: a.contributing_hypotheses || [],
               dominant_cause: a.dominant_cause, confidence: a.confidence, beliefs: a.beliefs || {},
               evidence_cited: a.evidence_cited || [], makes_target_claim: !!a.makes_target_claim,
               abstain_reason: a.abstain_reason };
    }
    const obs = t.observation || {};
    const cost = typeof obs.cost === "number" ? obs.cost : 0;
    cumulative += cost;
    return { index: t.index, kind: a.kind, experiment_id: a.experiment_id, parameters: a.parameters || {},
             cost, cumulative_cost: cumulative, beliefs: a.beliefs || {}, dominant_cause: a.dominant_cause,
             results: (obs.results || []).map(r => (r && typeof r === "object") ? r.value : String(r)) };
  });
}

function load(text, label) {
  const err = document.getElementById("error");
  try {
    state.records = parseJsonl(text);
  } catch (e) {
    err.textContent = `Could not load ${label}: ${e.message}`;
    err.hidden = false;
    return;
  }
  err.hidden = true;
  document.getElementById("source").textContent = `${label} · ${state.records.length} episode${state.records.length === 1 ? "" : "s"}`;
  renderList();
  select(0);
}

function loadSample() {
  load(document.getElementById("sample-results").textContent, "embedded sample (demo/results.jsonl)");
}

// ---- audit findings ----------------------------------------------------------
function findings(rec) {
  if (rec.verdict && Array.isArray(rec.verdict.fired)) return rec.verdict.fired;
  // Fallback for plain batch output: reconstruct what the verdict itself records.
  const v = rec.verdict, out = [], s = v.scores || {};
  if (v.verdict === "UNSAFE_ACTION" || s.safety === 0)
    out.push({ kind: "safety", id: "safety", verdict_label: "UNSAFE_ACTION", title: "Safety constraint breached",
               rule: "This results file does not record which safety rule fired.", evidence: [] });
  if (v.verdict === "PROTOCOL_VIOLATION")
    out.push({ kind: "protocol", id: "protocol", verdict_label: "PROTOCOL_VIOLATION", title: "Protocol constraint breached",
               rule: "This results file does not record which protocol rule fired.", evidence: [] });
  (v.reward_hacks || []).forEach(id => out.push({ kind: "reward_hack", id, verdict_label: "REWARD_HACK",
               title: `Reward hack ${id}`, rule: "", evidence: [] }));
  (v.flags || []).forEach(f => out.push(f === "fabricated_citation"
    ? { kind: "fabricated_citation", id: f, verdict_label: "REWARD_HACK", title: "Conclusion cites an experiment that was never run",
        rule: "", evidence: (s.fabricated_citations || []).map(e => ({ turn: null, text: `cites ${e}, which was never run` })) }
    : { kind: "flag", id: f, verdict_label: null, title: f, rule: "", evidence: [] }));
  if (!out.length && v.verdict !== "VALID_SUCCESS")
    out.push({ kind: "verdict", id: v.verdict, verdict_label: v.verdict, title: v.verdict, rule: "", evidence: [] });
  return out;
}

function isFlagged(rec) { return findings(rec).length > 0; }

function verdictClass(v) { return v === "VALID_SUCCESS" ? "ok" : BAD_VERDICTS.has(v) ? "bad" : "warn"; }

// ---- DOM helpers -------------------------------------------------------------
function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false)
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
function fmt(v) {
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(Math.round(v * 1000) / 1000);
  if (Array.isArray(v)) return v.map(fmt).join(", ");
  if (v && typeof v === "object") return JSON.stringify(v);
  return v === null || v === undefined ? "—" : String(v);
}
function kvTable(obj) {
  const keys = Object.keys(obj || {});
  if (!keys.length) return el("div", { class: "note" }, "(none)");
  return el("table", { class: "kv" }, keys.map(k => el("tr", {}, el("td", {}, k), el("td", { class: "v" }, fmt(obj[k])))));
}
function beliefBars(beliefs, dominant, prev) {
  const ids = Object.keys(beliefs || {}).sort();
  if (!ids.length) return el("div", {}, "(no beliefs)");
  return el("div", {}, ids.map(h => {
    const p = Number(beliefs[h]);
    const d = prev && h in prev ? p - Number(prev[h]) : 0;
    const delta = Math.abs(d) >= 0.005 ? el("span", { class: "delta " + (d > 0 ? "up" : "down") }, ` ${d > 0 ? "+" : ""}${d.toFixed(2)}`) : "";
    return el("div", { class: "belief" },
      el("span", { class: "h" + (h === dominant ? " dom" : "") }, h),
      el("div", { class: "bar" }, el("span", { style: `width:${Math.max(0, Math.min(1, p)) * 100}%` })),
      el("span", { class: "n" }, p.toFixed(2), delta));
  }));
}

// ---- rendering ---------------------------------------------------------------
function renderList() {
  const nav = document.getElementById("list");
  nav.replaceChildren(...state.records.map((rec, i) => {
    const v = rec.verdict.verdict, dc = rec.demo_case || {};
    return el("div", { class: "ep" + (i === state.current ? " active" : ""), onclick: () => select(i) },
      el("div", { class: "id" }, dc.id || rec.job.episode_id),
      dc.note ? el("div", { class: "note" }, dc.note) : null,
      el("div", { class: "row" },
        el("span", { class: "badge " + verdictClass(v) }, v),
        isFlagged(rec) ? el("span", { class: "badge bad" }, "flagged") : null,
        el("span", { class: "badge" }, `score ${fmt(rec.metrics.final_score)}`)));
  }));
}

function select(i) {
  stopPlay();
  state.current = i;
  state.step = 0;
  state.panelShownFor = null;
  closePanel();
  renderList();
  renderEpisode();
}

function totalSteps(rec) { return episodeSteps(rec).length + 1; }   // +1: auditor verdict

function renderEpisode() {
  const rec = state.records[state.current];
  const sec = document.getElementById("episode");
  if (!rec) { sec.replaceChildren(el("div", { class: "empty" }, "No episode selected.")); return; }
  const steps = episodeSteps(rec), n = steps.length + 1, job = rec.job, dc = rec.demo_case || {};
  const ran = new Set(steps.filter(s => s.kind !== "conclude").map(s => s.experiment_id));

  const cards = [];
  let prevBeliefs = null;
  steps.forEach((s, i) => {
    let card;
    if (s.kind === "conclude") {
      card = el("div", { class: "card" },
        el("h3", {}, el("span", { class: "step" }, `step ${i + 1} · turn ${s.index}`), "Conclusion",
           s.abstain_reason ? el("span", { class: "badge warn" }, `abstain: ${s.abstain_reason}`) : null),
        el("div", { class: "grid2" },
          el("div", {},
            el("div", { class: "label" }, "Claim"),
            el("table", { class: "kv" },
              el("tr", {}, el("td", {}, "contributing"), el("td", { class: "v" }, fmt(s.contributing_hypotheses))),
              el("tr", {}, el("td", {}, "dominant_cause"), el("td", { class: "v" }, fmt(s.dominant_cause))),
              el("tr", {}, el("td", {}, "confidence"), el("td", { class: "v" }, fmt(s.confidence))),
              el("tr", {}, el("td", {}, "makes_target_claim"), el("td", { class: "v" }, String(s.makes_target_claim)))),
            el("div", { class: "label" }, "Evidence cited"),
            s.evidence_cited.length ? el("ul", { class: "results" }, s.evidence_cited.map(c => {
              const exp = c && typeof c === "object" ? c.experiment : String(c);
              const sup = c && typeof c === "object" && c.supports ? ` as ${c.supports}` : " (supports omitted)";
              const notRun = !ran.has(exp);
              return el("li", { class: "cite" + (notRun ? " notrun" : "") }, `${exp}${sup}`, notRun ? " — never run" : "");
            })) : el("div", {}, "(none)")),
          el("div", {}, el("div", { class: "label" }, "Final beliefs (* = dominant cause)"),
             beliefBars(s.beliefs, s.dominant_cause, prevBeliefs))));
    } else {
      card = el("div", { class: "card" },
        el("h3", {}, el("span", { class: "step" }, `step ${i + 1} · turn ${s.index}`),
           `Bought ${s.experiment_id}`, el("span", { class: "cost" }, `cost ${fmt(s.cost)} · spent ${fmt(s.cumulative_cost)}`)),
        el("div", { class: "grid2" },
          el("div", {}, el("div", { class: "label" }, "Parameters"), kvTable(s.parameters),
             s.results.length ? el("div", {}, el("div", { class: "label" }, "Readout"),
               el("ul", { class: "results" }, s.results.map(r => el("li", {}, r)))) : null),
          el("div", {}, el("div", { class: "label" }, "Beliefs this turn (* = dominant cause)"),
             beliefBars(s.beliefs, s.dominant_cause, prevBeliefs))));
    }
    prevBeliefs = s.beliefs;
    cards.push(card);
  });

  const v = rec.verdict, m = rec.metrics, fs = findings(rec);
  cards.push(el("div", { class: "card" },
    el("h3", {}, el("span", { class: "step" }, `step ${n}`), "Auditor verdict"),
    el("div", { class: "verdict-big " + verdictClass(v.verdict) }, v.verdict),
    el("div", { class: "scorebox" },
      el("div", {}, el("b", {}, fmt(m.final_score)), el("span", {}, "raw score")),
      el("div", {}, el("b", {}, fmt(m.clean_success)), el("span", {}, "clean success")),
      el("div", {}, el("b", {}, fmt(m.nominal_success)), el("span", {}, "nominal success")),
      el("div", {}, el("b", {}, fmt(m.cost)), el("span", {}, "cost")),
      el("div", {}, el("b", {}, fmt(m.R_visible)), el("span", {}, "visible reward"))),
    el("div", { class: "grid2" },
      el("div", {}, el("div", { class: "label" }, "Scores"),
         kvTable(Object.fromEntries(Object.entries(v.scores || {}).filter(([, x]) => typeof x !== "object" || (Array.isArray(x) && x.length))))),
      el("div", {}, el("div", { class: "label" }, "Flags and reward hacks"),
         kvTable({ flags: (v.flags || []).length ? v.flags : "none", reward_hacks: (v.reward_hacks || []).length ? v.reward_hacks : "none",
                   reward_hack: m.reward_hack, protocol_violation: m.protocol_violation, brier: m.brier }),
         fs.length ? el("p", {}, el("button", { class: "primary", onclick: () => openPanel(rec) }, `Show audit findings (${fs.length})`)) : null))));

  sec.replaceChildren(
    el("div", { class: "ephead" },
      el("h2", {}, dc.id || job.episode_id),
      el("div", { class: "meta" },
        [dc.label && `label ${dc.label}`, `scenario ${job.scenario}`, `variant ${job.variant}`, `model ${job.model}`,
         `seed ${job.seed}`, rec.refusal_count ? `${rec.refusal_count} refusal(s)` : null].filter(Boolean).join(" · ")),
      dc.note ? el("div", { class: "meta" }, dc.note) : null),
    el("div", { class: "controls" },
      el("button", { id: "first", title: "first step (Home)", onclick: () => go(0) }, "|◀"),
      el("button", { id: "prev", title: "previous step (←)", onclick: () => go(state.step - 1) }, "◀ Prev"),
      el("button", { id: "next", class: "primary", title: "next step (→)", onclick: () => go(state.step + 1) }, "Next ▶"),
      el("button", { id: "last", title: "last step (End)", onclick: () => go(n - 1) }, "▶|"),
      el("button", { id: "play", title: "play (space)", onclick: togglePlay }, "Play"),
      el("span", { class: "pos", id: "pos" }),
      el("span", { class: "hint" }, "← → step · space play · Esc close panel")),
    el("div", { id: "cards" }, cards));
  applyStep();
}

function applyStep() {
  const rec = state.records[state.current];
  if (!rec) return;
  const n = totalSteps(rec);
  const cards = document.getElementById("cards").children;
  for (let i = 0; i < cards.length; i++) {
    cards[i].classList.toggle("future", i > state.step);
    cards[i].classList.toggle("current", i === state.step);
  }
  cards[state.step].scrollIntoView({ block: "nearest", behavior: "smooth" });
  const last = state.step === n - 1;
  document.getElementById("pos").textContent = `step ${state.step + 1} of ${n}` + (last ? " · verdict" : "");
  document.getElementById("prev").disabled = document.getElementById("first").disabled = state.step === 0;
  document.getElementById("next").disabled = document.getElementById("last").disabled = last;
  if (last) {
    stopPlay();
    if (isFlagged(rec) && state.panelShownFor !== state.current) { state.panelShownFor = state.current; openPanel(rec); }
  }
}

function go(step) {
  const rec = state.records[state.current];
  if (!rec) return;
  state.step = Math.max(0, Math.min(totalSteps(rec) - 1, step));
  applyStep();
}

function togglePlay() {
  if (state.timer) { stopPlay(); return; }
  const rec = state.records[state.current];
  if (!rec) return;
  if (state.step >= totalSteps(rec) - 1) go(0);
  document.getElementById("play").textContent = "Pause";
  state.timer = setInterval(() => go(state.step + 1), 1200);
}
function stopPlay() {
  if (state.timer) clearInterval(state.timer);
  state.timer = null;
  const b = document.getElementById("play");
  if (b) b.textContent = "Play";
}

function openPanel(rec) {
  const m = rec.metrics, steps = episodeSteps(rec);
  const panel = document.getElementById("flagpanel");
  panel.replaceChildren(
    el("button", { class: "close", onclick: closePanel }, "Close"),
    el("h2", {}, `Audit findings · ${rec.verdict.verdict}`),
    el("div", { class: "headline" }, `raw score ${fmt(m.final_score)} vs clean success ${typeof m.clean_success === "boolean" ? Number(m.clean_success) : fmt(m.clean_success)}`),
    ...findings(rec).map(f => el("div", { class: "finding" },
      el("div", { class: "top" },
        el("span", { class: "fid" }, f.id),
        el("span", { class: "badge" }, f.kind),
        f.verdict_label ? el("span", { class: "badge " + verdictClass(f.verdict_label) }, f.verdict_label) : null),
      el("div", { class: "title" }, f.title),
      f.rule ? el("p", { class: "rule" }, el("b", {}, "Rule: "), f.rule) : null,
      (f.evidence || []).length ? el("div", {}, el("div", { class: "label" }, "Evidence"),
        el("ul", {}, f.evidence.map(e => {
          const pos = e.turn === null || e.turn === undefined ? -1 : steps.findIndex(s => s.index === e.turn);
          return el("li", {}, pos >= 0 ? el("a", { onclick: () => go(pos) }, `turn ${e.turn}`) : null, pos >= 0 ? ": " : "", e.text);
        }))) : null)));
  panel.classList.add("open");
}
function closePanel() { document.getElementById("flagpanel").classList.remove("open"); }

// ---- wiring ------------------------------------------------------------------
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) f.text().then(t => load(t, f.name));
  e.target.value = "";
});
document.getElementById("sample-btn").addEventListener("click", loadSample);
document.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dropping"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
document.addEventListener("drop", e => {
  e.preventDefault();
  document.body.classList.remove("dropping");
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(t => load(t, f.name));
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") go(state.step + 1);
  else if (e.key === "ArrowLeft") go(state.step - 1);
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(Infinity);
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "Escape") closePanel();
});
if (document.getElementById("sample-results").textContent.trim()) loadSample();
</script>
</body>
</html>
