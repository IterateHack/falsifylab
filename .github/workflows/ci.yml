name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# No `concurrency:` block. `cancel-in-progress: true` on `ci-${{ github.ref }}`
# cancelled every queued or running job of a run as soon as a second push landed
# on the same branch. Several agents push to one branch in quick succession, so
# a rebase silently threw away the evidence for a commit that was about to merge.
# A superseded run costs about 5 job-minutes (run times below) on free
# public-repo runners. Dropping only `cancel-in-progress` would not be enough:
# a concurrency group still cancels a pending run when a third one queues.

# Timeouts catch a hung job, so each is the job's measured run time (runner
# start to job end, from the #69, #74, #75 and #77 runs) plus headroom:
#   root-gate    70-80 s  (pytest 48-55 s)  -> 15 min
#   lab-suite    56-62 s  (pytest 29 s)     -> 15 min
#   lab-web      18-19 s  (vite build 8 s)  -> 10 min
#   lab-windows  128-129 s                  -> 20 min
# The queued lab jobs that died on #74 and #75 were not timeouts. Each died
# about 15 minutes after queueing with the annotation "The job was not acquired
# by Runner of type hosted even after multiple attempts", whatever its own
# timeout-minutes was (15, 20 and 30 all died at 15m03s-15m04s). No
# timeout-minutes value changes that. The ci-complete job at the bottom makes
# it fail loudly instead.

jobs:
  root-gate:
    name: Root gate (pytest + pyflakes)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # measured run time + headroom: see top of file
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # Not 3.12: its compensated float sum() changes the last bits of the
          # demo re-audit Brier score, so the committed demo/ artifacts mismatch.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            runner/requirements.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt -r runner/requirements.txt pyflakes
      - name: Committed report assets are fresh
        run: python -m reports.asset_freshness
      - name: pytest (testpaths from pytest.ini)
        run: python -m pytest -q
      - name: pyflakes over tracked .py files
        run: git ls-files -z '*.py' | xargs -0 python -m pyflakes

  lab-suite:
    name: Lab suite (lab/)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # measured run time + headroom: see top of file
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: pytest (testpaths from lab/pyproject.toml)
        run: python -m pytest -q

  lab-web:
    name: Lab web build (lab/web)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # measured run time + headroom: see top of file
    defaults:
      run:
        working-directory: lab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lab/web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Build
        run: npm run build

  lab-windows:
    name: Lab suite on Windows (lab/)
    runs-on: windows-latest
    timeout-minutes: 20  # measured run time + headroom: see top of file
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: pytest (testpaths from lab/pyproject.toml)
        run: python -m pytest -q

  # A job that never got a runner shows in the checks list as cancelled, which
  # most tooling (and three agent sessions) reads as skipped, i.e. fine. This job
  # fails unless every job above actually ran and succeeded, and names the ones
  # that did not. Make "CI complete" a required status check on main, so a run
  # whose gate itself never gets a runner also blocks the merge.
  ci-complete:
    name: CI complete (every job ran and passed)
    needs: [root-gate, lab-suite, lab-web, lab-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$bad" ]; then
            for job in $bad; do
              echo "::error title=CI incomplete::$job did not run to success (cancelled, skipped or failed), so this commit has no evidence from it"
            done
            exit 1
          fi
