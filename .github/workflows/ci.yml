name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-gate:
    name: Root gate (pytest + pyflakes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Not 3.12: its compensated float sum() changes the last bits of the
          # demo re-audit Brier score, so the committed demo/ artifacts mismatch.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            runner/requirements.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt -r runner/requirements.txt pyflakes
      - name: pytest (testpaths from pytest.ini)
        run: python -m pytest -q
      - name: pyflakes over tracked .py files
        run: git ls-files -z '*.py' | xargs -0 python -m pyflakes

  lab-suite:
    name: Lab suite (lab/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: pytest (testpaths from lab/pyproject.toml)
        run: python -m pytest -q

  lab-web:
    name: Lab web build (lab/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lab/web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Build
        run: npm run build

  lab-windows:
    # Known failures on main at 9397c7e (10 failed, 94 passed, 1 skipped; was
    # 49 failed before the pass_fds fix in #62):
    # - 9 in evals/audit/test_audit_suite.py: the sandbox trace hook resolves
    #   ctypes.dlopen of a bare system DLL name ("kernel32", "tzres.dll")
    #   against the working directory, so ordinary library use is recorded as
    #   process_spawn and the audit returns UNSAFE_ACTION.
    # - 1 in engine/tests/test_engine.py (test_a_second_writer_is_refused):
    #   engine/events.py _pid_alive calls os.kill(pid, 0), which on Windows is
    #   TerminateProcess, not a liveness probe; for pid 1 it raises WinError 87.
    # continue-on-error stays until both are fixed; remove it then.
    name: Lab suite on Windows (known failures, dlopen trace + os.kill)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: pytest (testpaths from lab/pyproject.toml)
        run: python -m pytest -q
