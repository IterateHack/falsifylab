# Method from lessons/h2exp1.md (Tsherniak et al. 2017).
experiment: h2exp1_dependency_classes
paper: "doi:10.1016/j.cell.2017.06.010"
success_threshold: 0.6
process_threshold: 0.6
required:
  classifications: {type: dict, min_len: 17}
  method: {type: str, min_len: 20}
item_fields:
  - field: classifications
    kind: labels
    labels: [common_essential, selective, non_essential]
    top_k: 17
    min_fraction: 0.6
checkpoints:
  - id: loads_dataset
    desc: Loaded the DepMap gene-effect table that was provided
    strings_any_of: ["h2exp1_depmap_gene_effects"]
  - id: pools_per_gene
    desc: Pooled each gene's effects across all lines (grouped by gene)
    calls_any_of: ["groupby"]
  - id: looks_at_the_tail
    desc: Looked at a low percentile or minimum, not only the average
    calls_any_of: ["quantile", "percentile", "nanpercentile", "min"]
  - id: applies_a_dependency_threshold
    desc: Counted lines below a dependency threshold (-0.5 or -1.0)
    numbers_any_of: [-0.5, -1.0]
  - id: states_the_rule
    desc: The method states a threshold, fraction or tail rule
    answer_any_of: ["threshold", "fraction", "tail", "percentile", "-0.5", "-1.0"]
replay:
  null_data:
    - {op: shuffle_column, file: data/h2exp1_depmap_gene_effects.csv, column: gene, seed: 5}
