# Reasoning experiment: limited coverage. Method from lessons/h2exp2.md (Chan
# et al. 2019; van Wietmarschen et al. 2020).
experiment: h2exp2_lineage_confounder
paper: "doi:10.1038/s41586-019-1102-x"
known_dois: ["10.1038/s41586-020-2769-8"]
success_threshold: 0.6
process_threshold: 0.6
required:
  top_tissues: {type: list, min_len: 2}
  explanation: {type: str, min_len: 40}
  next_test: {type: str, min_len: 20}
checkpoints:
  - id: retrieves_earned_lessons
    desc: Retrieved the lesson cards earned so far
    event: read_lessons_called
  - id: ranks_tissues_from_the_data
    desc: Grouped the table by tissue to rank them
    calls_any_of: ["groupby"]
  - id: looks_beyond_lineage
    desc: Asked what else clusters by lineage (MSI, genotype) rather than stopping at tissue
    answer_any_of: ["msi", "microsatellite", "confound", "surrogate", "proxy"]
  - id: proposes_a_direct_test
    desc: Proposed annotating and testing the candidate variable within lineage
    answer_any_of: ["msi status", "stratif", "within lineage", "within-lineage", "within tissue", "annotation"]
  - id: applies_dependency_lesson
    desc: Used lesson 1 (tail standard, minimum counts) in the notebook
    section_any_of: {section: lessons_applied, any_of: ["h2exp1", "tail", "fraction", "threshold", "minimum"]}
